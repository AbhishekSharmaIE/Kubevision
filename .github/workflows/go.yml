name: Go

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Verify module
        run: go mod verify

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: go build -o /tmp/kubevision ./cmd/server
